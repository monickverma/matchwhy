<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Human-in-the-loop candidate-job matcher: hybrid embedding + BM25 evidence retrieval, confidence-routed review, feedback learning. Runs fully in your browser." />

    <title>MatchWhy: explainable, human-in-the-loop matching</title>

      try {
        var t = localStorage.getItem('matchwhy:theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
